# Assets Service - Federated Schema
# This service manages real-world asset metadata and ownership

extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.3",
        import: ["@key", "@shareable", "@inaccessible", "@override", "@provides", "@external"])

type Asset @key(fields: "contractId") {
  contractId: ID!
  title: String!
  location: String!
  description: String!
  assetType: AssetType!
  totalShares: Int!
  pricePerShare: Int!
  availableShares: Int!
  isPaused: Boolean!
  documents: [DocumentHash!]!
  createdAt: String!
  updatedAt: String!
  # Extended fields from other services
  owner: User @provides(fields: "walletAddress")
  transactions: [Transaction!] @provides(fields: "transactionId type status")
}

type DocumentHash {
  name: String!
  hash: String!
  mimeType: String
  uploadedAt: String!
}

enum AssetType {
  COMMERCIAL_REAL_ESTATE
  RESIDENTIAL
  AGRICULTURAL
  INFRASTRUCTURE
  COMMODITIES
  ART
  OTHER
}

input AssetFilter {
  search: String
  assetType: AssetType
  location: String
  isPaused: Boolean
}

input AssetInput {
  title: String!
  location: String!
  description: String!
  assetType: AssetType!
  totalShares: Int!
  pricePerShare: Int!
  availableShares: Int!
}

type Query {
  assets(filter: AssetFilter, limit: Int, offset: Int): [Asset!]!
  asset(contractId: ID!): Asset
  assetsCount: Int!
  searchAssets(query: String!, limit: Int): [Asset!]!
  pendingAssets: [Asset!]!
  assetStatistics: AssetStatistics!
}

type AssetStatistics {
  totalAssets: Int!
  pendingAssets: Int!
  totalSharesAvailable: Int!
  averagePricePerShare: Float!
  assetsByType: [AssetTypeCount!]!
}

# ─── Reference stubs for entities owned by other subgraphs ───────────────
# Asset.owner / Asset.transactions point at entities owned by the users and
# transactions services. Per Federation v2 the fields listed in @provides
# are declared @external here so this subgraph can serve them inline via
# @provides without claiming ownership. Keys match the owning subgraphs
# (User @key userId, Transaction @key transactionId).

type User @key(fields: "userId") {
  userId: ID!
  walletAddress: String! @external
}

type Transaction @key(fields: "transactionId") {
  transactionId: ID!
  type: TransactionType! @external
  status: TransactionStatus! @external
}

# Foreign enums mirrored from the transactions service so the provided
# field types are identical to the owning subgraph.
enum TransactionType {
  PURCHASE
  TRANSFER
  MINT
  BURN
  APPROVAL
  DEPOSIT
  WITHDRAWAL
}

enum TransactionStatus {
  PENDING
  CONFIRMED
  FAILED
  CANCELLED
}

type AssetTypeCount {
  assetType: AssetType!
  count: Int!
}

type Mutation {
  createAsset(input: AssetInput!): Asset!
  updateAsset(contractId: ID!, input: AssetInput!): Asset!
  deleteAsset(contractId: ID!): Boolean!
  approveAsset(contractId: ID!): Asset!
  pauseAsset(contractId: ID!): Asset!
  unpauseAsset(contractId: ID!): Asset!
}
